<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Bookings</title>
    <!-- Add this inside <head> OR just before your script -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx-populate/browser/xlsx-populate.min.js"></script>


    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 20px;
            padding-top: 60px;
        }

        .status-cell {
            font-weight: 600;
            text-transform: capitalize;
            text-align: center;
        }

        .status-confirmed {
            background-color: #dcfce7;
            /* light green */
            color: #166534;
            /* dark green */
        }

        .status-other {
            background-color: #fee2e2;
            /* light red */
            color: #991b1b;
            /* dark red */
        }


        .month-header {
            background: white;
            color: black;
            font-weight: bold;
            font-size: 26px;
        }

        .month-header td {
            background-color: white;
            padding: 12px;
            text-align: left;
        }


        /* Navbar */
        .navbar {
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
            padding: 20px 0;
            background: black;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        .nav-links {
            display: flex;
            justify-content: center;
            gap: 50px;
        }

        .nav-links a {
            color: #fff;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            text-transform: uppercase;
            position: relative;
            transition: 0.3s ease;
        }

        .nav-links a:hover {
            color: #ff007f;
        }

        .nav-links a::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -6px;
            width: 0%;
            height: 2px;
            background: #ff007f;
            transition: width 0.3s ease;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        th,
        td {
            padding: 10px;
            border: 2px solid black;
            text-align: center;
        }

        th {
            background: orange;
            color: black;
        }

        tr:nth-child(even) {
            background: #f9f9f9;
        }

        /* Loader Overlay */
        .loader-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        /* Loader Box */
        .loader-box {
            background: #fff;
            padding: 20px 40px;
            border-radius: 10px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #333;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }


        .edit-btn {
            background: #28a745;
            color: #fff;
        }

        .save-btn {
            background: #007bff;
            color: #fff;
        }


        .delete-btn {
            background: black;
            color: #fff;
        }

        .cancel-btn {
            background: #dc3545;
            color: #fff;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .nav-links {
                gap: 20px;
                flex-wrap: wrap;
            }
        }


        /* Modal overlay */
        #editModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            /* hidden by default */
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        /* Modal content */
        #editModal .modal-content {
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            width: 450px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.3s ease;
        }

        /* Heading */
        #editModal h2 {
            margin-bottom: 20px;
            text-align: center;
            font-size: 20px;
            color: #333;
        }

        /* Form styling */
        #editBookingForm {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px 15px;
        }

        /* Labels */
        #editBookingForm label {
            font-size: 14px;
            font-weight: bold;
            color: #444;
            grid-column: span 2;
            /* default full row */
        }

        /* Inputs & Select */
        #editBookingForm input,
        #editBookingForm select {
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            width: 100%;
            box-sizing: border-box;
        }

        /* Buttons container */
        #editBookingForm .actions {
            grid-column: span 2;
            text-align: right;
            margin-top: 15px;
        }

        /* Buttons */
        #editBookingForm button {
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }

        #editBookingForm .save-btn {
            background: #007bff;
            color: #fff;
            margin-right: 8px;
        }

        #editBookingForm .cancel-btn {
            background: #dc3545;
            color: #fff;
        }

        .btn {
            background: green;
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 5px;
            text-decoration: none;
            display: inline-block;
            transition: background 0.3s ease;
        }


        .btn:hover {
            background: black;
        }

        .button-container {
            display: flex;
            flex-wrap: wrap;
            /* allow wrapping on small screens */
            gap: 10px;
            /* spacing between buttons */
            justify-content: center;
            /* optional: center align */
        }


        .table-container {
            width: 100%;
            overflow-x: auto;
            /* enable horizontal scroll */
            -webkit-overflow-scrolling: touch;
            /* smooth scrolling on iOS */
        }

        /* Dropdown */
        .dropdown {
            position: relative;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background: #222;
            min-width: 180px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            border-radius: 6px;
            top: 100%;
            left: 0;
            z-index: 99;
        }

        .dropdown-content a {
            display: block;
            padding: 10px;
            color: white;
        }

        .dropdown-content a:hover {
            background: #444;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        /* Animation */
        @keyframes fadeIn {
            from {
                transform: scale(0.9);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="nav-links">
            <a href="../index.html">Home</a>

            <div class="dropdown">
                <a href="#">Event ▾</a>
                <div class="dropdown-content">
                    <a href="../Booking Form/Booking.html">Book Event</a>
                    <a href="../View Form/View.html">View Bookings</a>
                    <a href="../History/History.html">History Bookings</a>
                </div>
            </div>
            <a href="../Contact Form/Contact.html">Contact Us</a>
        </div>
    </nav>

    <h1>📋 All Bookings</h1>

    <!-- Loader Overlay -->
    <div id="loader" class="loader-overlay" style="display: none;">
        <div class="loader-box">
            ⏳ Fetching records from database...
        </div>
    </div>

    <div class="button-container">
        <button onclick="exportToExcel()" class="btn">
            ⬇ Export To Excel
        </button>
    </div>
    <div class="table-container">
        <table id="bookingsTable">
            <thead>
                <tr>
                    <th>S.No.</th>
                    <th>Client Name</th>
                    <th>Client Number</th>
                    <th>Event Date</th>
                    <th>Event type</th>
                    <th>Booker Name </th>
                    <th>Decorator</th>
                    <th>Booking Status</th>
                    <th>Quotation Delivered</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="bookingsBody"></tbody>
        </table>
    </div>

    <script>


        function formatTime(timeString) {
            const [hours, minutes] = timeString.split(':');
            const date = new Date();
            date.setHours(hours, minutes, 0, 0);

            return date.toLocaleTimeString('en-US', {
                hour: 'numeric',
                minute: '2-digit',
                hour12: true
            });
        }

        function formatDate(dateStr) {
            if (!dateStr) return "N/A";
            const date = new Date(dateStr);
            if (isNaN(date)) return "N/A";
            return date.toLocaleDateString("en-GB", {
                day: "2-digit",
                month: "long",
                year: "numeric"
            }).replace(/\s/g, "-");
        }


        function downloadPDF(url, filename) {
            fetch(url)
                .then(resp => resp.blob())
                .then(blob => {
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = filename;
                    link.click();
                    URL.revokeObjectURL(link.href);
                })
                .catch(err => console.error("Download failed", err));
        }

        // Helper to sanitize filename
        function sanitizeFilename(name) {
            return name.replace(/\s+/g, '_').replace(/[^\w\-]/g, '');
        }

        function getMonthYear(dateStr) {
            const d = new Date(dateStr);
            return d.toLocaleString("en-IN", {
                month: "long",
                year: "numeric"
            }); // e.g. January 2026
        }

        async function loadBookings() {
            const tbody = document.querySelector("#bookingsTable tbody");
            const loader = document.getElementById("loader");

            loader.style.display = "flex";

            try {
                const res = await fetch("https://soulmate-backend-production.up.railway.app/followups");
                const data = await res.json();
                tbody.innerHTML = "";

                if (data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="10">No bookings found</td></tr>`;
                    return;
                }

                let serial = 1;
                let lastMonth = "";

                data.forEach(row => {
                    const eventDate = formatDate(row.event_date);
                    const currentMonth = getMonthYear(row.event_date);

                    // 🔹 Month Header Row
                    if (currentMonth !== lastMonth) {
                        const monthRow = document.createElement("tr");
                        monthRow.classList.add("month-header-row");

                        monthRow.innerHTML = `
                    <td colspan="10" class="month-header">
                        ${currentMonth}
                    </td>
                `;

                        tbody.appendChild(monthRow);
                        lastMonth = currentMonth;
                    }

                    const tr = document.createElement("tr");

                    const pdfLink = row.has_quotation_pdf
                        ? `<a href="https://soulmate-backend-production.up.railway.app/bookings/${row.id}/followup-quotation-pdf" target="_blank">View</a>`
                        : "No PDF";

                    tr.innerHTML = `
                <td>${serial++}</td>
                <td>${row.client_name}</td>
                <td>${row.client_number}</td>
                <td>${eventDate}</td>
                <td>${row.event_type}</td>
                <td>${row.booker_name}</td>
                <td>${row.decorator}</td>
                <td class="status-cell ${row.booking_status?.toLowerCase() === 'confirmed' ? 'status-confirmed' : 'status-other'}">
    ${row.booking_status}
</td>

                <td>${pdfLink}</td>
                <td>
                    <button class="edit-btn" onclick="editRow(this, ${row.id})">Edit</button>
                </td>
            `;

                    tbody.appendChild(tr);
                });

            } catch (err) {
                console.error("Error fetching bookings:", err);
                tbody.innerHTML = `<tr><td colspan="10">❌ Error fetching bookings</td></tr>`;
            } finally {
                loader.style.display = "none";
            }
        }

        function formatDateForInput(dateString) {
            if (!dateString) return "";
            const date = new Date(dateString);
            if (isNaN(date)) return "";
            const yyyy = date.getFullYear();
            const mm = String(date.getMonth() + 1).padStart(2, "0");
            const dd = String(date.getDate()).padStart(2, "0");
            return `${yyyy}-${mm}-${dd}`;
        }

        function formatTimeForInput(timeString) {
            if (!timeString) return "";
            let t = timeString.trim();
            const ampmMatch = t.match(/(\d{1,2}):(\d{2})\s*(AM|PM)/i);
            if (ampmMatch) {
                let hh = parseInt(ampmMatch[1], 10);
                const mm = ampmMatch[2];
                const ampm = ampmMatch[3].toUpperCase();
                if (ampm === "PM" && hh !== 12) hh += 12;
                if (ampm === "AM" && hh === 12) hh = 0;
                return `${String(hh).padStart(2, "0")}:${mm}`;
            }
            const parts = t.split(":");
            if (parts.length >= 2) {
                return `${parts[0].padStart(2, "0")}:${parts[1].padStart(2, "0")}`;
            }
            return "";
        }

        let originalData = {};
        function editRow(btn, id) {
            const tr = btn.closest("tr");
            const tds = tr.querySelectorAll("td");

            originalData = {
                client_name: tds[1].innerText.trim(),
                client_number: tds[2].innerText.trim(),
                event_start_date: formatDateForInput(tds[3].innerText.trim()),
                event_end_date: formatDateForInput(tds[4].innerText.trim()),
                event_type: tds[5].innerText.trim(),
                venue: tds[6].innerText.trim(),
                total_amount: tds[7].innerText.replace("₹", "").replace(/,/g, "").trim(),
                advance_received: tds[8].innerText.replace("₹", "").replace(/,/g, "").trim(),
                received_by: tds[9].innerText.trim(),
                event_time: formatTimeForInput(tds[10].innerText.trim())
            };

            document.querySelector("#editBookingId").value = id;
            document.querySelector("#editClientName").value = tds[1].innerText.trim();
            document.querySelector("#editClientNumber").value = tds[2].innerText.trim();
            document.querySelector("#editStartDate").value = formatDateForInput(tds[3].innerText.trim());
            document.querySelector("#editEndDate").value = formatDateForInput(tds[4].innerText.trim());
            document.querySelector("#editEventTime").value = formatTimeForInput(tds[10].innerText.trim());
            document.querySelector("#editEventType").value = tds[5].innerText.trim();
            document.querySelector("#editVenue").value = tds[6].innerText.trim();
            document.querySelector("#editTotalAmount").value = tds[7].innerText.replace("₹", "").replace(/,/g, "").trim();
            document.querySelector("#editAdvanceReceived").value = tds[8].innerText.replace("₹", "").replace(/,/g, "").trim();
            document.querySelector("#editReceivedBy").value = tds[9].innerText.trim();

            document.getElementById("editModal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("editModal").style.display = "none";
            document.getElementById("editQuotationPdf").value = "";
            document.getElementById("editPlanningPdf").value = "";
        }

        // Store pending changes + id until password entered
        let pendingChanges = {};
        let pendingId = null;

        async function saveEdit() {
            const id = document.querySelector("#editBookingId").value;
            const current = {
                client_name: document.querySelector("#editClientName").value.trim(),
                client_number: document.querySelector("#editClientNumber").value.trim(),
                event_start_date: document.querySelector("#editStartDate").value,
                event_end_date: document.querySelector("#editEndDate").value,
                event_type: document.querySelector("#editEventType").value,
                venue: document.querySelector("#editVenue").value,
                total_amount: document.querySelector("#editTotalAmount").value,
                advance_received: document.querySelector("#editAdvanceReceived").value,
                received_by: document.querySelector("#editReceivedBy").value,
                event_time: document.querySelector("#editEventTime").value
            };

            console.log("Original Data:", originalData);
            console.log("Current Data:", current);
            let changes = {};
            for (const key in current) {
                if (current[key] !== originalData[key]) {
                    changes[key] = current[key];
                }
            }

            // if (Object.keys(changes).length === 0) {
            //     alert("No changes detected!");
            //     return;
            // }
            console.log("Changes detected for ID:", id, changes);
            // Open password modal instead of prompt
            askPassword(id, changes);
        }

        // --- Password Modal Logic ---
        function askPassword(id, changes) {
            pendingId = id;
            pendingChanges = changes;
            document.getElementById("updatePassword").value = "";
            document.getElementById("passwordModal").style.display = "flex";
        }

        function closePasswordModal() {
            document.getElementById("passwordModal").style.display = "none";
            pendingChanges = {};
            pendingId = null;
        }

        async function submitPassword() {
            const password = document.getElementById("updatePassword").value.trim();
            if (!password) {
                alert("❌ Please enter password");
                return;
            }

            try {
                const formData = new FormData();
                formData.append("password", password);

                // Add only changed fields (text values)
                for (let key in pendingChanges) {
                    formData.append(key, pendingChanges[key]);
                }

                // Add files if selected
                const quotationFile = document.getElementById("editQuotationPdf").files[0];
                const planningFile = document.getElementById("editPlanningPdf").files[0];
                if (quotationFile) formData.append("pdfUpload", quotationFile);
                if (planningFile) formData.append("planingpdfUpload", planningFile);

                const res = await fetch(`https://soulmate-backend-production.up.railway.app/bookings/${pendingId}`, {
                    method: "PUT",
                    body: formData
                });

                if (!res.ok) throw new Error("Update failed");

                alert("✅ Booking updated!");
                closePasswordModal();
                closeModal();
                loadBookings();
            } catch (err) {
                alert("❌ Failed to update booking");
                console.error(err);
            }

            document.getElementById("editQuotationPdf").value = "";
            document.getElementById("editPlanningPdf").value = "";

        }


        window.onload = loadBookings;


        let pendingDeleteId = null;

        function deleteEdit(id) {
            pendingDeleteId = id;
            document.getElementById("deletePassword").value = "";
            document.getElementById("deletePasswordModal").style.display = "flex";
        }

        function closeDeletePasswordModal() {
            document.getElementById("deletePasswordModal").style.display = "none";
            pendingDeleteId = null;
        }

        async function submitDeletePassword() {
            const password = document.getElementById("deletePassword").value.trim();
            if (!password) {
                alert("❌ Please enter password");
                return;
            }

            try {
                const res = await fetch(`https://soulmate-backend-production.up.railway.app/bookings/${pendingDeleteId}`, {
                    method: "DELETE",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ password })
                });

                const result = await res.json();
                if (res.ok && result.success) {
                    alert("✅ Booking deleted successfully");
                    closeDeletePasswordModal();
                    closeModal();
                    loadBookings();
                } else {
                    alert("❌ " + (result.message || "Failed to delete booking"));
                }
            } catch (err) {
                console.error("Error deleting booking:", err);
                alert("❌ Error deleting booking");
            }
        }


        window.onclick = function (e) {
            const modal = document.getElementById("editModal");
            if (e.target === modal) {
                closeModal();
            }
        };
    </script>

</body>

</html>
