    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;

        /* =========================
   BOOKING STATUS BADGES
========================= */

        .status-cell {
            text-align: center;
            padding: 14px !important;
        }

        .status-badge {
            display: inline-block;
            padding: 8px 14px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            min-width: 170px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.12);
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        /* Confirmed */
        .status-confirmed {
            background: linear-gradient(135deg, #22c55e, #15803d);
            color: white;
            border-color: #bbf7d0;
        }

        /* Pending */
        .status-pending {
            background: linear-gradient(135deg, #facc15, #eab308);
            color: #111827;
            border-color: #fde68a;
        }

        /* In Discussion */
        .status-discussion {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            border-color: #bfdbfe;
        }

        /* Following */
        .status-following {
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            color: white;
            border-color: #ddd6fe;
        }

        /* Quotation Shared */
        .status-quotation {
            background: linear-gradient(135deg, #06b6d4, #0e7490);
            color: white;
            border-color: #a5f3fc;
        }

        /* Not Responding */
        .status-noresponse {
            background: linear-gradient(135deg, #f97316, #c2410c);
            color: white;
            border-color: #fdba74;
        }

        /* Cancelled / Booked By Other */
        .status-cancelled {
            background: linear-gradient(135deg, #ef4444, #991b1b);
            color: white;
            border-color: #fecaca;
        }

        /* Default */
        .status-default {

        }

    <script>


        function getFinalValue(selectId, textareaId, fieldName) {

            let dropdown =
                document.getElementById(selectId).value;

            let manual =
                document.getElementById(textareaId)
                    .value
                    .trim();

            if (dropdown === "Enter Manually") {

                if (manual === "") {

                    alert("❌ Please enter " + fieldName);
                    throw "manual missing";

                }

                return manual;

            }

            return dropdown;
        }

        function handleManualField(selectId, textareaId) {

            const dropdown =
                document.getElementById(selectId);

            const textarea =
                document.getElementById(textareaId);

            if (dropdown.value === "Enter Manually") {

                textarea.style.display = "block";
                textarea.required = true;

            } else {

                textarea.style.display = "none";
                textarea.required = false;
                textarea.value = "";

            }
        }


        function setFieldValue(selectId, textareaId, value) {

            let dropdown =
                document.getElementById(selectId);

            let textarea =
                document.getElementById(textareaId);

            let exists =
                [...dropdown.options]
                    .some(opt => opt.value === value);

            if (exists) {

                dropdown.value = value;

                textarea.style.display = "none";
                textarea.value = "";

            } else {

                dropdown.value = "Enter Manually";

                textarea.style.display = "block";
                textarea.value = value;

            }
        }

        function exportToExcel() {
            const table = document.getElementById("bookingsTable");

            let data = [];
            console.log(table.rows);
            for (let row of table.rows) {
                let rowData = [];
                console.log("Row:", row);
                for (let cell of row.cells) {
                    let text = cell.innerText.trim();

                    // Convert ₹ values to numbers
                    if (/₹/.test(text)) {
                        text = Number(text.replace(/[₹,]/g, ""));
                    }

                    rowData.push(text);
                }
                data.push(rowData);
            }

            console.log("Extracted Data:", data);
            for (let i = 0; i < data.length; i++) {
                console.log("Row " + i + " Length: " + data[i].length);
                if (data[i].length > 8) {
                    // Remove last 2 columns (PDF + Action)
                    data[i] = data[i].slice(0, -3);
                }
            }
            // Remove last 2 columns (PDF + Action)
            // data = data.map(r => r.slice(0, -3));
            console.log("removed Extracted Data:", data);
            const rowCount = data.length;
            const colCount = data[0].length;

            // Excel-safe column letter generator
            function getColLetter(n) {
                let s = "";
                while (n > 0) {
                    let m = (n - 1) % 26;
                    s = String.fromCharCode(65 + m) + s;
                    n = Math.floor((n - 1) / 26);
                }
                return s;
            }

            const lastColLetter = getColLetter(colCount);

            XlsxPopulate.fromBlankAsync().then(workbook => {
                const sheet = workbook.sheet(0);
                sheet.name("Follow-ups");

                sheet.cell("A1").value(data);

                // Header styling
                sheet.range(`A1:${lastColLetter}1`).style({
                    bold: true,
                    fill: "FFA500",
                    fontColor: "000000",
                    horizontalAlignment: "center",
                    verticalAlignment: "center"
                });

                // Zebra striping
                for (let i = 2; i <= rowCount; i++) {
                    if (i % 2 === 0) {
                        sheet.range(`A${i}:${lastColLetter}${i}`).style("fill", "F2F2F2");
                    }
                }

                // Currency formatting
                sheet.column(8).style({
                    numberFormat: '"₹"#,##0',
                    horizontalAlignment: "right"
                });
                sheet.column(9).style({
                    numberFormat: '"₹"#,##0',
                    horizontalAlignment: "right"
                });

                // Borders + wrapping (table only)
                sheet.range(`A1:${lastColLetter}${rowCount}`).style({
                    border: true,
                    verticalAlignment: "center",
                    wrapText: true
                });

                // Column widths
                for (let c = 1; c <= colCount; c++) {
                    sheet.column(c).width(30);
                }

                return workbook.outputAsync();
            }).then(blob => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = "Follow-Ups.xlsx";
                a.click();
                URL.revokeObjectURL(url);
            });
        }

        function formatTime(timeString) {
            const [hours, minutes] = timeString.split(':');
            const date = new Date();
            date.setHours(hours, minutes, 0, 0);

            return date.toLocaleTimeString('en-US', {
                hour: 'numeric',
                minute: '2-digit',
                hour12: true
            });
        }

        function formatDate(dateStr) {
            if (!dateStr) return "N/A";
            const date = new Date(dateStr);
            if (isNaN(date)) return "N/A";
            return date.toLocaleDateString("en-GB", {
                day: "2-digit",
                month: "long",
                year: "numeric"
            }).replace(/\s/g, "-");
        }


        function downloadPDF(url, filename) {
            fetch(url)
                .then(resp => resp.blob())
                .then(blob => {
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = filename;
                    link.click();
                    URL.revokeObjectURL(link.href);
                })
                .catch(err => console.error("Download failed", err));
        }

        // Helper to sanitize filename
        function sanitizeFilename(name) {
            return name.replace(/\s+/g, '_').replace(/[^\w\-]/g, '');
        }

        function getMonthYear(dateStr) {
            const d = new Date(dateStr);
            return d.toLocaleString("en-IN", {
                month: "long",
                year: "numeric"
            }); // e.g. January 2026
        }

        async function downloadQuotationPDF(id, clientName) {
            try {
                const response = await fetch(
                    `https://soulmate-backend-production.up.railway.app/bookings/${id}/followup-quotation-pdf`
                );

                const blob = await response.blob();

                const url = window.URL.createObjectURL(blob);

                const a = document.createElement("a");
                a.href = url;
                const cleanName = clientName.trim().replace(/\s+/g, " ");

                a.download = `SoulmateEvents-${cleanName}.pdf`;

                document.body.appendChild(a);
                a.click();

                a.remove();
                window.URL.revokeObjectURL(url);

            } catch (error) {
                console.error("Download failed:", error);
                alert("Failed to download PDF");
            }
        }

        async function loadBookings() {
            const tbody = document.querySelector("#bookingsTable tbody");
            const loader = document.getElementById("loader");

            loader.style.display = "flex";

            try {
                const res = await fetch("https://soulmate-backend-production.up.railway.app/followups");
                let data = await res.json();

                tbody.innerHTML = "";

                if (!data || data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="10">No followups found</td></tr>`;
                    return;
                }

                // ✅ SORT DATA BY EVENT DATE (Ascending Month Order)
                data.sort((a, b) => {
                    const dateA = new Date(a.event_date);
                    const dateB = new Date(b.event_date);

                    if (isNaN(dateA)) return 1;
                    if (isNaN(dateB)) return -1;

                    return dateA - dateB;
                });

                let serial = 1;
                let lastMonth = "";

                data.forEach(row => {

                    // Skip invalid dates
                    if (!row.event_date) return;

                    const eventDate = formatDate(row.event_date);
                    const currentMonth = getMonthYear(row.event_date);

                    // ✅ ADD MONTH HEADER ONLY WHEN MONTH CHANGES
                    if (currentMonth !== lastMonth) {

                        const monthRow = document.createElement("tr");
                        monthRow.classList.add("month-header-row");

                        monthRow.innerHTML = `
                    <td colspan="10" class="month-header">
                        ${currentMonth}
                    </td>
                `;

                        tbody.appendChild(monthRow);

                        lastMonth = currentMonth;
                    }

                    const tr = document.createElement("tr");

                    // PDF Column
                    // PDF Column
                    const pdfLink = row.has_quotation_pdf
                        ? `
        <div style="display:flex; gap:8px; align-items:center;">

            <a href="https://soulmate-backend-production.up.railway.app/bookings/${row.id}/followup-quotation-pdf"
               target="_blank"
               style="
                    text-decoration:none;
                    background:#2563eb;
                    color:white;
                    padding:7px 14px;
                    border-radius:8px;
                    font-size:13px;
                    font-weight:600;
                    box-shadow:0 2px 6px rgba(37,99,235,0.25);
                    transition:0.3s;
               "
               onmouseover="this.style.background='#1d4ed8'"
               onmouseout="this.style.background='#2563eb'">
               View
            </a>

            <button
                onclick="downloadQuotationPDF(${row.id}, '${(row.client_name || 'Client').replace(/'/g, "\\'")}')"
                style="
                    background:linear-gradient(135deg,#16a34a,#22c55e);
                    color:white;
                    border:none;
                    padding:10px 8px;
                    border-radius:8px;
                    cursor:pointer;
                    font-size:8px;
                    font-weight:700;
                    box-shadow:0 3px 8px rgba(34,197,94,0.3);
                    transition:all 0.3s ease;
                "
                onmouseover="
                    this.style.transform='translateY(-2px)';
                    this.style.boxShadow='0 6px 12px rgba(34,197,94,0.4)';
                "
                onmouseout="
                    this.style.transform='translateY(0px)';
                    this.style.boxShadow='0 3px 8px rgba(34,197,94,0.3)';
                ">
                ⬇ Download
            </button>

        </div>
      `
                        : `
<div style="
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:8px 14px;
    border-radius:12px;
    background:linear-gradient(135deg,#ef4444,#991b1b);
    color:white;
    font-size:12px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.5px;
    box-shadow:0 3px 10px rgba(239,68,68,0.25);
    border:2px solid #fecaca;
">
    ❌ No PDF
</div>
`;
                    // Status Styling
                    let statusClass = "status-default";

                    const status = (row.booking_status || "").toLowerCase();

                    if (status.includes("confirmed")) {
                        statusClass = "status-confirmed";

                    } else if (status.includes("pending")) {
                        statusClass = "status-pending";

                    } else if (
                        status.includes("following")
                    ) {
                        statusClass = "status-following";

                    } else if (
                        status.includes("discussion")
                    ) {
                        statusClass = "status-discussion";

                    } else if (
                        status.includes("quotation")
                    ) {
                        statusClass = "status-quotation";

                    } else if (
                        status.includes("not responding")
                    ) {
                        statusClass = "status-noresponse";

                    } else if (
                        status.includes("cancelled") ||
                        status.includes("booked by other")
                    ) {
                        statusClass = "status-cancelled";
                    }

                    tr.innerHTML = `
                <td>${serial++}</td>
                <td>${row.client_name || ""}</td>
                <td>${row.client_number || ""}</td>
                <td>${eventDate}</td>
                <td>${row.event_type || ""}</td>
                <td>${row.booker_name || ""}</td>
                <td>${row.decorator || ""}</td>

<td class="status-cell">
    <span class="status-badge ${statusClass}">
        ${row.booking_status || ""}
    </span>
</td>

                <td>${pdfLink}</td>

                <td>
                    <button class="edit-btn" onclick="editRow(this, ${row.id})">
                        Edit
                    </button>
                </td>
            `;

                    tbody.appendChild(tr);

                });

            } catch (err) {

                console.error("Error fetching bookings:", err);

                tbody.innerHTML =
                    `<tr><td colspan="10">❌ Error fetching bookings</td></tr>`;

            } finally {

                loader.style.display = "none";

            }
        }
        function formatDateForInput(dateString) {
            if (!dateString) return "";
            const date = new Date(dateString);
            if (isNaN(date)) return "";
            const yyyy = date.getFullYear();
            const mm = String(date.getMonth() + 1).padStart(2, "0");
            const dd = String(date.getDate()).padStart(2, "0");
            return `${yyyy}-${mm}-${dd}`;
        }

        function formatTimeForInput(timeString) {
            if (!timeString) return "";
            let t = timeString.trim();
            const ampmMatch = t.match(/(\d{1,2}):(\d{2})\s*(AM|PM)/i);
            if (ampmMatch) {
                let hh = parseInt(ampmMatch[1], 10);
                const mm = ampmMatch[2];
                const ampm = ampmMatch[3].toUpperCase();
                if (ampm === "PM" && hh !== 12) hh += 12;
                if (ampm === "AM" && hh === 12) hh = 0;
                return `${String(hh).padStart(2, "0")}:${mm}`;
            }
            const parts = t.split(":");
            if (parts.length >= 2) {
                return `${parts[0].padStart(2, "0")}:${parts[1].padStart(2, "0")}`;
            }
            return "";
        }

        let originalData = {};
        function editRow(btn, id) {

            const tr = btn.closest("tr");
            const tds = tr.querySelectorAll("td");

            originalData = {
                client_name: tds[1].innerText.trim(),
                client_number: tds[2].innerText.trim(),
                event_date: formatDateForInput(tds[3].innerText.trim()),
                event_type: tds[4].innerText.trim(),
                booker_name: tds[5].innerText.trim(),
                decorator: tds[6].innerText.trim(),
                booking_status: tds[7].innerText.trim()
            };

            console.log("Original Data Set:", originalData);


            document.querySelector("#editBookingId").value = id;
            document.querySelector("#editClientName").value = tds[1].innerText.trim();
            document.querySelector("#editClientNumber").value = tds[2].innerText.trim();
            document.querySelector("#editEventDate").value = formatDateForInput(tds[3].innerText.trim());
            setFieldValue(
                "editEvent",
                "manualEvent",
                tds[4].innerText.trim()
            );

            setFieldValue(
                "editBookerName",
                "manualBooker",
                tds[5].innerText.trim()
            );

            setFieldValue(
                "editDecorator",
                "manualDecorator",
                tds[6].innerText.trim()
            );

            setFieldValue(
                "editBookingStatus",
                "manualBookingStatus",
                tds[7].innerText.trim()
            );

            document.getElementById("editModal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("editModal").style.display = "none";
            document.getElementById("editQuotationPdf").value = "";
        }

        // Store pending changes + id until password entered
        let pendingChanges = {};
        let pendingId = null;

        async function saveEdit() {

            const id =
                document.querySelector("#editBookingId").value;

            let current = {}; // ✅ Declare outside try

            try {

                let eventValue =
                    getFinalValue(
                        "editEvent",
                        "manualEvent",
                        "Event"
                    );

                let bookerValue =
                    getFinalValue(
                        "editBookerName",
                        "manualBooker",
                        "Booker Name"
                    );

                let decoratorValue =
                    getFinalValue(
                        "editDecorator",
                        "manualDecorator",
                        "Decorator"
                    );

                let statusValue =
                    getFinalValue(
                        "editBookingStatus",
                        "manualBookingStatus",
                        "Booking Status"
                    );

                current = {

                    client_name:
                        document.querySelector("#editClientName").value.trim(),

                    client_number:
                        document.querySelector("#editClientNumber").value.trim(),

                    event_date:
                        document.querySelector("#editEventDate").value,

                    event_type:
                        eventValue,

                    booker_name:
                        bookerValue,

                    decorator:
                        decoratorValue,

                    booking_status:
                        statusValue

                };

            }
            catch (err) {

                return; // stop if manual missing

            }

            console.log("Original Data:", originalData);
            console.log("Current Data:", current);

            let changes = {};

            for (const key in current) {

                if (current[key] !== originalData[key]) {

                    changes[key] = current[key];

                }

            }

            console.log("Changes detected for ID:", id, changes);

            // Open password modal
            askPassword(id, changes);

        }        // --- Password Modal Logic ---
        function askPassword(id, changes) {
            pendingId = id;
            pendingChanges = changes;
            document.getElementById("updatePassword").value = "";
            document.getElementById("passwordModal").style.display = "flex";
        }

        function closePasswordModal() {
            document.getElementById("passwordModal").style.display = "none";
            pendingChanges = {};
            pendingId = null;
        }

        async function submitPassword() {
            const password = document.getElementById("updatePassword").value.trim();
            if (!password) {
                alert("❌ Please enter password");
                return;
            }

            try {
                const formData = new FormData();
                formData.append("password", password);

                // Add only changed fields (text values)
                for (let key in pendingChanges) {
                    formData.append(key, pendingChanges[key]);
                }

                // Add files if selected
                const quotationFile = document.getElementById("editQuotationPdf").files[0];
                if (quotationFile) formData.append("pdfUpload", quotationFile);

                const res = await fetch(`https://soulmate-backend-production.up.railway.app/followups/${pendingId}`, {
                    method: "PUT",
                    body: formData
                });

                if (!res.ok) throw new Error("Update failed");

                alert("✅ Booking updated!");
                closePasswordModal();
                closeModal();
                loadBookings();
            } catch (err) {
                alert("❌ Failed to update booking");
                console.error(err);
            }

            document.getElementById("editQuotationPdf").value = "";

        }


        window.onload = loadBookings;


        let pendingDeleteId = null;

        function deleteEdit(id) {
            pendingDeleteId = id;
            document.getElementById("deletePassword").value = "";
            document.getElementById("deletePasswordModal").style.display = "flex";
        }

        function closeDeletePasswordModal() {
            document.getElementById("deletePasswordModal").style.display = "none";
            pendingDeleteId = null;
        }

        async function submitDeletePassword() {
            const password = document.getElementById("deletePassword").value.trim();
            if (!password) {
                alert("❌ Please enter password");
                return;
            }
            console.log("Deleting ID:", pendingDeleteId);
            try {
                const res = await fetch(`https://soulmate-backend-production.up.railway.app/followups/${pendingDeleteId}`, {
                    method: "DELETE",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ password })
                });

                const result = await res.json();
                if (res.ok && result.success) {
                    alert("✅ Follow-up deleted successfully");
                    closeDeletePasswordModal();
                    closeModal();
                    loadBookings();
                } else {
                    alert("❌ " + (result.message || "Failed to delete follow-up"));
                }
            } catch (err) {
                console.error("Error deleting follow-up:", err);
                alert("❌ Error deleting follow-up");
            }
        }


        window.onclick = function (e) {
            const modal = document.getElementById("editModal");
            if (e.target === modal) {
                closeModal();
            }
        };

        document.querySelectorAll("textarea").forEach(t => {

            t.addEventListener("input", function () {

                this.style.height = "auto";
                this.style.height =
                    this.scrollHeight + "px";

            });

        });
    </script>
