<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Bookings</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 20px;
            padding-top: 60px;
        }

        /* Navbar */
        .navbar {
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
            padding: 20px 0;
            background: rgba(0, 0, 0, 0.6);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        .nav-links {
            display: flex;
            justify-content: center;
            gap: 50px;
        }

        .nav-links a {
            color: #fff;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            text-transform: uppercase;
            position: relative;
            transition: 0.3s ease;
        }

        .nav-links a:hover {
            color: #ff007f;
        }

        .nav-links a::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -6px;
            width: 0%;
            height: 2px;
            background: #ff007f;
            transition: width 0.3s ease;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        th,
        td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #007bff;
            color: white;
        }

        tr:nth-child(even) {
            background: #f9f9f9;
        }

        /* Dropdown */
        .dropdown {
            position: relative;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background: #222;
            min-width: 180px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            border-radius: 6px;
            top: 100%;
            left: 0;
            z-index: 99;
        }

        .dropdown-content a {
            display: block;
            padding: 10px;
            color: white;
        }

        .dropdown-content a:hover {
            background: #444;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            background: #ff007f;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s ease;
        }

        button:hover {
            background: #cc0066;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .nav-links {
                gap: 20px;
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="nav-links">
            <a href="../index.html">Home</a>
            <!-- 🎤 Dropdowns omitted for brevity (same as yours) -->
            <a href="../Booking Form/Booking.html">Book Event</a>
            <a href="../View Form/View.html">View Bookings</a>
            <a href="../Contact Form/Contact.html">Contact Us</a>
        </div>
    </nav>

    <h1>📋 All Bookings</h1>

    <table id="bookingsTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Client Name</th>
                <th>Client Number</th>
                <th>Event Date</th>
                <th>Event Type</th>
                <th>Venue</th>
                <th>Total Amount</th>
                <th>Advance Received</th>
                <th>Received By</th>
                <th>Event Time</th>
                <th>PDF</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <button onclick="resetBookings()">Reset All Bookings</button>

    <script>
        async function loadBookings() {
            try {
                const res = await fetch("https://soulmate-backend-production.up.railway.app/bookings");
                const data = await res.json();
                const tbody = document.querySelector("#bookingsTable tbody");
                tbody.innerHTML = "";

                if (data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="11">No bookings found</td></tr>`;
                    return;
                }

                data.forEach(row => {
                    const tr = document.createElement("tr");

                    // ✅ Format as Day-Month-Year
                    const eventDate = new Date(row.event_date).toLocaleDateString("en-GB", {
                        day: "2-digit",
                        month: "long",
                        year: "numeric"
                    }).replace(/\s/g, "-");

                    // ✅ Convert buffer → Blob → URL for PDF
                    let pdfLink = "No PDF";
                    if (row.pdf_file && row.pdf_file.data) {
                        const pdfBytes = new Uint8Array(row.pdf_file.data);
                        const blob = new Blob([pdfBytes], { type: "application/pdf" });
                        const url = URL.createObjectURL(blob);
                        pdfLink = `<a href="${url}" target="_blank">View PDF</a>`;
                    }

                    tr.innerHTML = `
            <td>${row.id}</td>
            <td>${row.client_name}</td>
            <td>${row.client_number}</td>
            <td>${eventDate}</td>
            <td>${row.event_type}</td>
            <td>${row.venue}</td>
            <td>₹${parseFloat(row.total_amount).toLocaleString()}</td>
            <td>₹${parseFloat(row.advance_received).toLocaleString()}</td>
            <td>${row.received_by}</td>
            <td>${row.event_time}</td>
            <td>${pdfLink}</td>
          `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error("Error fetching bookings:", err);
            }
        }

        async function resetBookings() {
            if (!confirm("Are you sure you want to delete all bookings?")) return;

            try {
                const res = await fetch("https://soulmate-backend-production.up.railway.app/bookings/reset", {
                    method: "DELETE"
                });
                const data = await res.json();
                alert(data.message);
                loadBookings(); // refresh table
            } catch (err) {
                console.error("Error resetting bookings:", err);
            }
        }

        loadBookings();
    </script>

</body>

</html>
