<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Bookings</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 20px;
            padding-top: 60px;
        }

        /* Navbar */
        .navbar {
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
            padding: 20px 0;
            background: rgba(0, 0, 0, 0.6);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        .nav-links {
            display: flex;
            justify-content: center;
            gap: 50px;
        }

        .nav-links a {
            color: #fff;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            text-transform: uppercase;
            position: relative;
            transition: 0.3s ease;
        }

        .nav-links a:hover {
            color: #ff007f;
        }

        .nav-links a::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -6px;
            width: 0%;
            height: 2px;
            background: #ff007f;
            transition: width 0.3s ease;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        th,
        td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #007bff;
            color: white;
        }

        tr:nth-child(even) {
            background: #f9f9f9;
        }

        /* Loader Overlay */
        .loader-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        /* Loader Box */
        .loader-box {
            background: #fff;
            padding: 20px 40px;
            border-radius: 10px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #333;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .nav-links {
                gap: 20px;
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="nav-links">
            <a href="../index.html">Home</a>
            <a href="../Booking Form/Booking.html">Book Event</a>
            <a href="../View Form/View.html">View Bookings</a>
            <a href="../Contact Form/Contact.html">Contact Us</a>
        </div>
    </nav>

    <h1>📋 All Bookings</h1>

    <!-- Loader Overlay -->
    <div id="loader" class="loader-overlay" style="display: none;">
        <div class="loader-box">
            ⏳ Fetching records from database...
        </div>
    </div>

    <table id="bookingsTable">
        <thead>
            <tr>
                <th>Client Name</th>
                <th>Client Number</th>
                <th>Event Start Date</th>
                <th>Event End Date</th>
                <th>Event Type</th>
                <th>Event Venue</th>
                <th>Total Amount</th>
                <th>Advance Received</th>
                <th>Received By</th>
                <th>Event Time</th>
                <th>PDF</th>
            </tr>
        </thead>
        <tbody id="bookingsBody"></tbody>
    </table>

    <script>
        function formatTime(timeString) {
            const [hours, minutes] = timeString.split(':');
            const date = new Date();
            date.setHours(hours, minutes, 0, 0);

            return date.toLocaleTimeString('en-US', {
                hour: 'numeric',
                minute: '2-digit',
                hour12: true
            });
        }

        async function loadBookings() {
            const tbody = document.querySelector("#bookingsTable tbody");
            const loader = document.getElementById("loader");

            // Show loader
            loader.style.display = "flex";

            try {
                const res = await fetch("https://soulmate-backend-production.up.railway.app/bookings");
                const data = await res.json();
                tbody.innerHTML = "";

                if (data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="11">No bookings found</td></tr>`;
                    return;
                }

                data.forEach(row => {
                    const tr = document.createElement("tr");

                    const eventStartDate = new Date(row.event_start_date).toLocaleDateString("en-GB", {
                        day: "2-digit",
                        month: "long",
                        year: "numeric"
                    }).replace(/\s/g, "-");

                    const eventEndDate = new Date(row.event_end_date).toLocaleDateString("en-GB", {
                        day: "2-digit",
                        month: "long",
                        year: "numeric"
                    }).replace(/\s/g, "-");

                    let pdfLink = "No PDF";
                    if (row.pdf_file && row.pdf_file.data) {
                        const pdfBytes = new Uint8Array(row.pdf_file.data);
                        const blob = new Blob([pdfBytes], { type: "application/pdf" });
                        const url = URL.createObjectURL(blob);
                        pdfLink = `<a href="${url}" target="_blank">View PDF</a>`;
                    }

                    tr.innerHTML = `
            <td>${row.client_name}</td>
            <td>${row.client_number}</td>
            <td>${eventStartDate}</td>
            <td>${eventEndDate}</td>
            <td>${row.event_type}</td>
            <td>${row.venue}</td>
            <td>₹${parseFloat(row.total_amount).toLocaleString()}</td>
            <td>₹${parseFloat(row.advance_received).toLocaleString()}</td>
            <td>${row.received_by}</td>
            <td>${formatTime(row.event_time)}</td>
            <td>${pdfLink}</td>
          `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error("Error fetching bookings:", err);
                tbody.innerHTML = `<tr><td colspan="11">❌ Error fetching bookings</td></tr>`;
            } finally {
                // Hide loader
                loader.style.display = "none";
            }
        }

        // Call on page load
        loadBookings();
    </script>

</body>

</html>
