<!DOCTYPE html>
<html lang="en">

<head>
<title>View Planning - Soulmate Events</title>

<style>
body{
    margin:0;
    font-family:Arial;
}

.container{
    width:95%;
    margin:auto;
    text-align:center;
}

#planningTextArea{
    width:100%;
    height:70vh;   /* takes 70% of screen height */
    resize:none;
}
</style>

</head>

<body>

<div class="container">

<h2>Soulmate Event Planning</h2>

<button onclick="loadText()">Load Planning</button>

<br><br>

<textarea id="planningTextArea" readonly></textarea>

<br><br>

<button onclick="updateText()">Update Planning</button>
<button onclick="downloadFile()">Download Planning</button>
<button onclick="downloadPdfFile()">Download as PDF</button>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>

const params = new URLSearchParams(window.location.search);
const fetchUrl = params.get("url");
const clientName = params.get("client");
const startDate = params.get("date");

console.log("Fetch URL:", fetchUrl);
console.log("Client Name:", clientName);
console.log("Start Date:", startDate);

window.onload = loadText;


async function downloadPdfFile() {

    try {

        const res = await fetch(fetchUrl);

        if (res.status === 404) {
            alert("No planning content found.");
            return;
        }

        const text = await res.text();

        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF();

        const pageHeight = pdf.internal.pageSize.height;
        const margin = 10;
        const lineHeight = 7;

        const lines = pdf.splitTextToSize(text, 180);

        let y = margin;

        lines.forEach((line) => {

            if (y + lineHeight > pageHeight - margin) {
                pdf.addPage();
                y = margin;
            }

            pdf.text(line, margin, y);
            y += lineHeight;

        });

        pdf.save(`${clientName}_${startDate}_planning.pdf`);

    } catch (error) {

        console.error(error);
        alert("Failed to download planning content.");

    }
}


async function downloadFile() {

    try {

        const res = await fetch(fetchUrl);

        if(res.status === 404){
            alert("No planning content found.");
            return;
        }

        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = a.download = `${clientName}_${startDate}_planning.txt`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);

    } catch (error) {

        console.error(error);
        alert("Failed to download planning content.");

    }
}

async function loadText() {

    const textArea = document.getElementById("planningTextArea");

    try {

        const res = await fetch(fetchUrl);

        if(res.status === 404){
            alert("No planning content found.");
            textArea.value = "";
            textArea.readOnly = false;
            return;
        }

        const data = await res.text();

        textArea.value = data || "";
        textArea.readOnly = false;

    } catch (error) {

        console.error(error);
        alert("Failed to load planning content.");

    }
}

async function updateText() {

    const textArea = document.getElementById("planningTextArea");

    try {

        const res = await fetch(fetchUrl,{
            method:"POST",
            headers:{
                "Content-Type":"text/plain"
            },
            body:textArea.value
        });

        if(!res.ok){
            throw new Error(res.status);
        }

        alert("Planning content updated successfully!");

    } catch(error){

        console.error(error);
        alert("Failed to update planning content.");

    }
}

</script>

</body>
</html>
