<!DOCTYPE html>
<html lang="en">

<head>
<title>View Planning - Soulmate Events</title>

<style>
body{
    margin:0;
    font-family:Arial;
}

.container{
    width:95%;
    margin:auto;
    text-align:center;
}

#planningTextArea{
    width:100%;
    height:70vh;   /* takes 70% of screen height */
    resize:none;
}
</style>

</head>

<body>

<div class="container">

<h2>Soulmate Event Planning</h2>

<button onclick="loadText()">Load Planning</button>

<br><br>

<textarea id="planningTextArea" readonly></textarea>

<br><br>

<button onclick="updateText()">Update Planning</button>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const fetchUrl = params.get("url");

window.onload = loadText;

async function loadText() {

    const textArea = document.getElementById("planningTextArea");

    try {

        const res = await fetch(fetchUrl);

        if(res.status === 404){
            alert("No planning content found.");
            textArea.value = "";
            textArea.readOnly = false;
            return;
        }

        const data = await res.text();

        textArea.value = data || "";
        textArea.readOnly = false;

    } catch (error) {

        console.error(error);
        alert("Failed to load planning content.");

    }
}

async function updateText() {

    const textArea = document.getElementById("planningTextArea");

    try {

        const res = await fetch(fetchUrl,{
            method:"POST",
            headers:{
                "Content-Type":"text/plain"
            },
            body:textArea.value
        });

        if(!res.ok){
            throw new Error(res.status);
        }

        alert("Planning content updated successfully!");

    } catch(error){

        console.error(error);
        alert("Failed to update planning content.");

    }
}

</script>

</body>
</html>
