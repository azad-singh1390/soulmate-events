<!DOCTYPE html>
<html lang="en">

<head>
<title>View Planning - Soulmate Events</title>
</head>

<body>

<h2 style="text-align:center;">Soulmate Event Planning</h2>

<button onclick="loadText()">Load Planning</button>

<br><br>

<textarea id="planningTextArea" rows="20" style="width:90%;" readonly></textarea>

<br><br>

<button onclick="updateText()">Update Planning</button>

<script>

async function loadText() {

    const textArea = document.getElementById("planningTextArea");

    try {

        const res = await fetch("https://soulmate-backend-production.up.railway.app/planning-txt/1");

        if (!res.ok) {
            throw new Error(`HTTP error! status: ${res.status}`);
        }

        const data = await res.text();

        if (data) {
            textArea.value = data;
            textArea.readOnly = false;
        } else {
            alert("No planning content found.");
        }

    } catch (error) {

        console.error("Error fetching planning content:", error);
        alert("Failed to load planning content.");

    }

}

async function updateText() {

    const textArea = document.getElementById("planningTextArea");
    const content = textArea.value;

    try {

        const res = await fetch("https://soulmate-backend-production.up.railway.app/planning-txt/1", {
            method: "POST",
            headers: {
                "Content-Type": "text/plain"
            },
            body: content
        });

        if (!res.ok) {
            throw new Error(`HTTP error! status: ${res.status}`);
        }

        alert("Planning content updated successfully!");

    } catch (error) {

        console.error("Error updating planning content:", error);
        alert("Failed to update planning content.");

    }

}

</script>

</body>

</html>
