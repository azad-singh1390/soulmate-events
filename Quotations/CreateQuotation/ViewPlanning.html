<!DOCTYPE html>
<html lang="en">

<head>
<title>View Planning - Soulmate Events</title>

<style>
body{
    margin:0;
    font-family:"Segoe UI", Arial, sans-serif;
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

.container{
    width:95%;
    max-width:1000px;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
    text-align:center;
}

h2{
    margin-top:0;
    color:#333;
}

#planningTextArea{
    width:100%;
    height:60vh;
    resize:none;
    border:1px solid #ccc;
    border-radius:8px;
    padding:15px;
    font-size:15px;
    line-height:1.5;
    box-sizing:border-box;
}

#planningTextArea:focus{
    outline:none;
    border-color:#2c5364;
    box-shadow:0 0 5px rgba(44,83,100,0.4);
}

/* generic button style */
.btn{
    padding:10px 20px;
    margin:6px;
    border:none;
    border-radius:6px;
    font-size:14px;
    cursor:pointer;
    color:white;
    transition:all 0.2s ease;
}

.btn:hover{
    transform:translateY(-2px);
    box-shadow:0 5px 10px rgba(0,0,0,0.2);
}

/* button colors */
.btn-primary{ background:#007bff; }
.btn-success{ background:#28a745; }
.btn-purple{ background:#6f42c1; }
.btn-dark{ background:#2c5364; }
</style>

</head>

<body>

<div class="container">

<h2>Soulmate Event Planning</h2>

<button class="btn btn-dark" onclick="loadText()">Load Planning</button>

<br><br>

<textarea id="planningTextArea" readonly></textarea>

<br><br>

<button class="btn btn-success" onclick="updateText()">Update Planning</button>

<button class="btn btn-primary" onclick="downloadFile()">Download Planning</button>

<button class="btn btn-purple" onclick="downloadPdfFile()">Download as PDF</button>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>

const params = new URLSearchParams(window.location.search);
const fetchUrl = params.get("url");
const clientName = params.get("client");
const startDate = params.get("date");

console.log("Fetch URL:", fetchUrl);
console.log("Client Name:", clientName);
console.log("Start Date:", startDate);

window.onload = loadText;


async function downloadPdfFile() {

    try {

        const res = await fetch(fetchUrl);

        if (res.status === 404) {
            alert("No planning content found.");
            return;
        }

        const text = await res.text();

        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF();

        const pageHeight = pdf.internal.pageSize.height;
        const margin = 10;
        const lineHeight = 7;

        const lines = pdf.splitTextToSize(text, 180);

        let y = margin;

        lines.forEach((line) => {

            if (y + lineHeight > pageHeight - margin) {
                pdf.addPage();
                y = margin;
            }

            pdf.text(line, margin, y);
            y += lineHeight;

        });

        pdf.save(`${clientName}_${startDate}_planning.pdf`);

    } catch (error) {

        console.error(error);
        alert("Failed to download planning content.");

    }
}


async function downloadFile() {

    try {

        const res = await fetch(fetchUrl);

        if(res.status === 404){
            alert("No planning content found.");
            return;
        }

        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = a.download = `${clientName}_${startDate}_planning.txt`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);

    } catch (error) {

        console.error(error);
        alert("Failed to download planning content.");

    }
}

async function loadText() {

    const textArea = document.getElementById("planningTextArea");

    try {

        const res = await fetch(fetchUrl);

        if(res.status === 404){
            alert("No planning content found.");
            textArea.value = "";
            textArea.readOnly = false;
            return;
        }

        const data = await res.text();

        textArea.value = data || "";
        textArea.readOnly = false;

    } catch (error) {

        console.error(error);
        alert("Failed to load planning content.");

    }
}

async function updateText() {

    const textArea = document.getElementById("planningTextArea");

    try {

        const res = await fetch(fetchUrl,{
            method:"POST",
            headers:{
                "Content-Type":"text/plain"
            },
            body:textArea.value
        });

        if(!res.ok){
            throw new Error(res.status);
        }

        alert("Planning content updated successfully!");

    } catch(error){

        console.error(error);
        alert("Failed to update planning content.");

    }
}

</script>

</body>
</html>
