<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Soulmate Event Bill</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        .amount-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 5px;
        }

        .amount-row input[type="number"] {
            width: 120px;
        }

        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;

            height: 40px;

            font-size: 12px;

            border-top: 1px solid #ccc;

            background: white;

            display: flex;
            justify-content: space-between;

            padding: 8px 20px;
        }

        /* Navbar */
        .navbar {
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
            padding: 20px 0;
            background: rgba(0, 0, 0, 0.6);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        .nav-spacer {
            display: inline-block;
            width: 20px;
            /* space size */
        }

        .nav-links {
            display: flex;
            justify-content: center;
            gap: 50px;
        }

        .nav-links a {
            color: #fff;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            text-transform: uppercase;
            position: relative;
            transition: 0.3s ease;
        }

        .nav-links a:hover {
            color: #ff007f;
        }

        .nav-links a::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -6px;
            width: 0%;
            height: 2px;
            background: #ff007f;
            transition: width 0.3s ease;
        }

        .nav-links a:hover::after {
            width: 100%;
        }


        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        .form-row {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            width: 30%;
        }

        .form-label {
            width: 80px;
            font-weight: bold;
        }

        .form-input {
            flex: 1;
        }

        .block {
            background: white;
            padding: 15px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            break-inside: avoid;
            page-break-inside: avoid;
        }

        .blockSoundItemsDetails {
            width: 100%;
            min-height: 80px;
            resize: vertical;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 14px;
            padding: 8px;
        }

        .blockStageItemDetails {
            width: 100%;
            min-height: 80px;
            resize: vertical;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 14px;
            padding: 8px;
        }

        .block-footer {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: bold;
        }

        .blockSoundAmount {
            width: 100px;
            padding: 5px;
            font-size: 14px;
        }


        .blockStageAmount {
            width: 100px;
            padding: 5px;
            font-size: 14px;
        }

        .removeBtn {
            margin-left: auto;
            padding: 6px 12px;
            background-color: #d9534f;
            color: white;
            border: none;
            cursor: pointer;
        }

        .removeBtn:hover {
            background-color: #c9302c;
        }

        button {
            margin-top: 10px;
            padding: 6px 12px;
            cursor: pointer;
        }
    </style>
</head>

    <h2 align="center">Soulmate Bill Generation Page</h2>

    <div class="form-row">
        <label for="client" class="form-label">NAME</label>
        <input id="client" class="form-input" placeholder="Client Name" value="Rahul Sharma">
    </div>

    <div class="form-row">
        <label for="event" class="form-label">EVENT</label>
        <select id="event" class="form-input">
            <option value="">Select Event</option>
            <option value="Destination Wedding">Destination Wedding</option>
            <option value="Wedding">Wedding</option>
            <option value="Sangeet">Sangeet</option>
            <option value="Cocktail">Cocktail</option>
            <option value="Haldi">Haldi</option>
            <option value="Engagement">Engagement</option>
            <option value="Roka ceremony">Roka ceremony</option>
            <option value="Anniversary">Anniversary</option>
            <option value="Reception">Reception</option>
            <option value="Conference">Conference</option>
            <option value="Corporate">Corporate</option>
            <option value="Birthday">Birthday</option>
            <option value="Other">Other</option>
        </select>
    </div>

    <div class="form-row" id="otherEventRow" style="display:none;">
        <label for="otherEvent" class="form-label">OTHER</label>
        <input id="otherEvent" class="form-input" placeholder="Enter Other Event">
    </div>

    <div class="form-row">
        <label for="dateFrom" class="form-label">FROM</label>
        <input type="date" id="dateFrom" class="form-input">
    </div>

    <div class="form-row">
        <label for="dateTo" class="form-label">TO</label>
        <input type="date" id="dateTo" class="form-input">
    </div>

    <div class="form-row">
        <label for="venue" class="form-label">VENUE</label>
        <select id="venue" class="form-input">
            <option value="">Select Venue</option>
            <option value="Noor Mahal">Noor Mahal</option>
            <option value="Eden">Eden</option>
            <option value="Amani Farms">Amani Farm</option>
            <option value="Other">Other</option>
        </select>
    </div>

    <div class="form-row" id="otherVenueRow" style="display:none;">
        <label for="otherVenue" class="form-label">OTHER</label>
        <input id="otherVenue" class="form-input" placeholder="Enter Other Venue">
    </div>

        let blockCount = 0;

        // On page load
        window.onload = function () {
            const today = new Date().toISOString().split("T")[0];
            document.getElementById("dateFrom").value = today;
            document.getElementById("dateTo").value = today;
            document.getElementById("event").value = "Destination Wedding";
            document.getElementById("venue").value = "Noor Mahal";
            addBlock();
        };

        // Show/hide other fields
        document.getElementById("event").addEventListener("change", () => {
            document.getElementById("otherEventRow").style.display = (document.getElementById("event").value === "Other") ? "flex" : "none";
        });
        document.getElementById("venue").addEventListener("change", () => {
            document.getElementById("otherVenueRow").style.display = (document.getElementById("venue").value === "Other") ? "flex" : "none";
        });

        // Add new block
        function addBlock() {

            blockCount++;

            const div = document.createElement("div");
            div.className = "block";

            div.innerHTML = `

<h4>Item Block ${blockCount}</h4>

<label><b>Sound Details:</b></label>
<textarea class="blockSoundItemsDetails">
Sound System
Cordless Mics
DJ Console
</textarea>

<div class="amount-row">
    <label class="checkbox-label">
        <input type="checkbox" class="checkboxSoundAmount">
        Total Amount
    </label>

    <input type="number"
           class="blockSoundAmount"
           value="0"
           disabled>
</div>

<br>

<label><b>Stage / Floor Details:</b></label>
<textarea class="blockStageItemDetails">
Dance Floor 16x24
Stage 16x32
</textarea>

<div class="amount-row">
    <label class="checkbox-label">
        <input type="checkbox" class="checkboxStageAmount">
        Total Amount
    </label>

    <input type="number"
           class="blockStageAmount"
           value="0"
           disabled>
</div>

<button class="removeBtn"
        onclick="this.parentElement.remove()">
Remove
</button>

`;

            document.getElementById("blocks").appendChild(div);

            // SOUND checkbox logic
            const soundCheckbox = div.querySelector(".checkboxSoundAmount");
            const soundAmount = div.querySelector(".blockSoundAmount");

            soundCheckbox.addEventListener("change", () => {
                soundAmount.disabled = !soundCheckbox.checked;

                if (!soundCheckbox.checked)
                    soundAmount.value = 0;
            });

            // STAGE checkbox logic
            const stageCheckbox = div.querySelector(".checkboxStageAmount");
            const stageAmount = div.querySelector(".blockStageAmount");

            stageCheckbox.addEventListener("change", () => {
                stageAmount.disabled = !stageCheckbox.checked;

                if (!stageCheckbox.checked)
                    stageAmount.value = 0;
            });

        }
        // Form validation
        function validateForm() {

            // Validate inputs
            const inputs = document.querySelectorAll("input");

            for (let input of inputs) {

                if (input.offsetParent === null) continue;

                // Skip disabled amount fields
                if (input.disabled) continue;

                if (input.type !== "checkbox" &&
                    input.value.trim() === "") {

                    alert("Please fill all required fields");
                    input.focus();
                    return false;
                }
            }

            // Validate dropdowns
            const selects = document.querySelectorAll("select");

            for (let select of selects) {

                if (select.value === "") {

                    alert("Please select all dropdowns");
                    select.focus();
                    return false;
                }
            }

            // Validate blocks
            const blocks = document.querySelectorAll(".block");

            if (blocks.length === 0) {

                alert("Add at least one item block");
                return false;
            }

            for (let block of blocks) {

                // SOUND textarea
                const soundTextarea =
                    block.querySelector(".blockSoundItemsDetails");

                if (soundTextarea.value.trim() === "") {

                    alert("Sound items cannot be empty");
                    soundTextarea.focus();
                    return false;
                }

                // STAGE textarea
                const stageTextarea =
                    block.querySelector(".blockStageItemDetails");

                if (stageTextarea.value.trim() === "") {

                    alert("Stage/Floor details cannot be empty");
                    stageTextarea.focus();
                    return false;
                }

                // SOUND amount validation
                const soundCheckbox =
                    block.querySelector(".checkboxSoundAmount");

                const soundAmount =
                    block.querySelector(".blockSoundAmount");

                if (soundCheckbox.checked &&
                    Number(soundAmount.value) <= 0) {

                    alert("Enter Sound amount");
                    soundAmount.focus();
                    return false;
                }

                // STAGE amount validation
                const stageCheckbox =
                    block.querySelector(".checkboxStageAmount");

                const stageAmount =
                    block.querySelector(".blockStageAmount");

                if (stageCheckbox.checked &&
                    Number(stageAmount.value) <= 0) {

                    alert("Enter Stage amount");
                    stageAmount.focus();
                    return false;
                }
            }

            return true;
        }

        // Generate PDF
        function generatePDF() {

            if (!validateForm()) return;

            const client = document.getElementById("client").value;

            let event = document.getElementById("event").value;
