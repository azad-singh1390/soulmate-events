    <script>

        function autoResizeTextarea(textarea) {

            // Reset height
            textarea.style.height = "auto";

            // Set height based on content
            textarea.style.height =
                textarea.scrollHeight + "px";

        }

        // Disable all fields initially
        const formFields = document.querySelectorAll("#formFields input, #formFields select");
        formFields.forEach(field => field.disabled = true);

        // Toggle enable/disable
        document.getElementById("enableHeader").addEventListener("change", function () {
            formFields.forEach(field => field.disabled = !this.checked);
        });
    </script>

        function validateForm() {

            // Validate visible inputs
            const inputs = document.querySelectorAll("input");

            for (let input of inputs) {

                if (input.offsetParent === null) continue;

                // Skip disabled fields
                if (input.disabled) continue;

                if (input.type !== "checkbox" &&
                    input.value.trim() === "") {

                    alert("Please fill all required fields");
                    input.focus();
                    return false;
                }
            }

            // Validate dropdowns
            const selects = document.querySelectorAll("select");

            for (let select of selects) {

                if (select.offsetParent === null) continue;

                if (select.value === "") {

                    alert("Please select all dropdowns");
                    select.focus();
                    return false;
                }
            }

            // Validate blocks
            const blocks = document.querySelectorAll(".block");

            if (blocks.length === 0) {

                alert("Add at least one item block");
                return false;
            }

            for (let block of blocks) {

                // Skip disabled block (if you use block enable checkbox)
                const blockEnabled =
                    block.querySelector(".enableBlockCheckbox");

                if (blockEnabled && !blockEnabled.checked)
                    continue;

                            itemHTML += `<b style="color: #D94F8A;">♡ ${line.replace("❖", "").trim()}</b><br>`;

                        } else {

                                itemHTML += `<li>${line}</li>`;
                            }
                            else {

                        if (amount > 0) {

        function formatDate(date) {

            return new Date(date).toLocaleDateString('en-GB', {
                day: '2-digit',
                month: 'short',
                year: 'numeric'
            });
        }

        document.addEventListener("change", function (e) {

            if (e.target.classList.contains("sectionEnableCheckbox")) {

                const section =
                    e.target.closest(".section");

                const textarea =
                    section.querySelector("textarea");

                const amountCheckbox =
                    section.querySelector(".checkboxAmount");

                const amountInput =
                    section.querySelector(".blockAmount");

                const enabled = e.target.checked;

                // Enable textarea
                textarea.disabled = !enabled;

                // Enable amount checkbox
                amountCheckbox.disabled = !enabled;

                // Enable amount input only if checkbox checked
                amountInput.disabled =
                    !enabled || !amountCheckbox.checked;
            }

            // Amount checkbox toggle
            if (e.target.classList.contains("checkboxAmount")) {

                const section =
                    e.target.closest(".section");

                const amountInput =
                    section.querySelector(".blockAmount");

                amountInput.disabled =
                    !e.target.checked;
            }

        });


        document.addEventListener("DOMContentLoaded", function () {

            document.querySelectorAll("textarea").forEach(textarea => {

                autoResizeTextarea(textarea);

                textarea.addEventListener("input", function () {

                    autoResizeTextarea(this);

                });

            });

        });

        function addItem(button) {

            const block =
                button.closest(".block");

            const container =
                block.querySelector(".itemsContainer");

            // Count existing items
            const itemCount =
                container.querySelectorAll(".section").length;

            // Next item number
            const nextItemNumber =
                itemCount + 1;

            const newItemHTML =
                createSection(
                    `ITEM ${nextItemNumber}`,
                    "blockItem1Details",
                    "Add Details here..."
                );

            container.insertAdjacentHTML(
                "beforeend",
                newItemHTML
            );
        }

        function formatTimeToAMPM(time24) {

            if (!time24) return "";

            const [hours, minutes] = time24.split(":");

            let h = parseInt(hours);
            const m = minutes;

            const ampm = h >= 12 ? "PM" : "AM";

            h = h % 12;
            h = h ? h : 12; // 0 becomes 12

            return `${h}:${m} ${ampm}`;
        }
