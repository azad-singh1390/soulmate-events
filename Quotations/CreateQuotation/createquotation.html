<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dynamic Event Quotation</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
body {
    font-family: "Times New Roman", serif;
    background: #f2f2f2;
    padding: 20px;
}

input, textarea, select {
    width: 100%;
    padding: 6px;
    margin-bottom: 8px;
}

button {
    padding: 8px 14px;
    background: black;
    color: white;
    border: none;
    cursor: pointer;
    margin-top: 5px;
}

.block {
    background: white;
    padding: 15px;
    margin-bottom: 12px;
    border: 1px solid #ccc;
}

.remove {
    background: darkred;
}

/* Date Row */
.date-row {
    display: flex;
    align-items: center;
    gap: 10px;
}

.date-row input {
    flex: 1;
}

.to-text {
    font-weight: bold;
}

/* Disabled section */
.disabled-section {
    opacity: 0.5;
    pointer-events: none;
}

/* PDF */
#pdf {
    background: white;
    padding: 30px;
    width: 800px;
    margin: auto;
}

.section {
    margin-top: 25px;
}

.row {
    display: flex;
    margin-bottom: 6px;
}

.label {
    width: 120px;
    font-weight: bold;
}

.items {
    margin-left: 20px;
}

.total {
    font-weight: bold;
    margin-top: 8px;
}
</style>
</head>

<body>

<h2>Quotation Details</h2>

<input id="client" placeholder="Client Name">

<!-- ENABLE EVENT DETAILS -->
<label>
    <input type="checkbox" id="enableEventDetails" onchange="toggleEventDetails()">
    Enable Event Details
</label>

<br><br>

<!-- EVENT DETAILS -->
<div id="eventDetails" class="disabled-section">

    <!-- EVENT TYPE -->
    <select id="eventTypeSelect" onchange="handleEventTypeChange()" disabled>
        <option value="" disabled selected hidden>Select Event Type</option>
        <option>Birthday</option>
        <option>Anniversary</option>
        <option>Engagement</option>
        <option>Sangeet</option>
        <option>Ring Ceremony</option>
        <option>Roka Ceremony</option>
        <option>Wedding</option>
        <option>Destination Wedding</option>
        <option>Corporate</option>
        <option>Get Together</option>
        <option value="Other">Other</option>
    </select>

    <input id="eventTypeOther" placeholder="Enter Event Type" style="display:none;" disabled>

    <!-- EVENT DATES -->
    <label><b>Event Dates</b></label>
    <div class="date-row">
        <span class="to-text">From</span>
        <input type="date" id="dateFrom" disabled>
        <span class="to-text">To</span>
        <input type="date" id="dateTo" disabled>
    </div>

</div>

<h3>Event Blocks</h3>
<div id="blocks"></div>

<button onclick="addBlock()">➕ Add New Event Block</button>
<button onclick="generatePDF()">📄 Generate PDF</button>

<hr>

<!-- PDF CONTENT -->
<div id="pdf">
    <h2 style="text-align:center;">Event Quotation</h2>

    <div class="row"><div class="label">Client:</div><div id="pClient"></div></div>
    <div class="row"><div class="label">Event:</div><div id="pEvent"></div></div>
    <div class="row"><div class="label">Dates:</div><div id="pDates"></div></div>

    <div id="pdfBlocks"></div>

    <hr>
    <div class="total">Grand Total: ₹ <span id="grandTotal"></span></div>

    <div class="section">
        <b>Payment Schedule</b><br>
        Token: Any Amount<br>
        75% Before Event<br>
        Remaining Payment After Event
    </div>
</div>

<script>
let blockCount = 0;

/* ENABLE / DISABLE EVENT DETAILS */
function toggleEventDetails() {
    const enabled = enableEventDetails.checked;
    eventDetails.classList.toggle("disabled-section", !enabled);

    eventDetails.querySelectorAll("select, input").forEach(el => {
        el.disabled = !enabled;
    });

    if (!enabled) {
        eventTypeSelect.value = "";
        eventTypeOther.value = "";
        eventTypeOther.style.display = "none";
        dateFrom.value = "";
        dateTo.value = "";
    }
}

/* EVENT TYPE OTHER */
function handleEventTypeChange() {
    if (eventTypeSelect.value === "Other") {
        eventTypeOther.style.display = "block";
        eventTypeOther.disabled = false;
        eventTypeOther.focus();
    } else {
        eventTypeOther.style.display = "none";
        eventTypeOther.value = "";
        eventTypeOther.disabled = true;
    }
}

/* FORMAT DATE */
function formatDate(dateStr) {
    return new Date(dateStr).toLocaleDateString("en-GB", {
        day: "numeric",
        month: "long",
        year: "numeric"
    });
}

/* ADD EVENT BLOCK */
function addBlock() {
    blockCount++;
    const div = document.createElement("div");
    div.className = "block";
    div.innerHTML = `
        <h4>Event Block ${blockCount}</h4>

        <label><b>Date</b></label>
        <input type="date" class="blockDate">

        <label><b>Venue</b></label>
        <input class="blockVenue" placeholder="Venue">

        <label><b>Time</b></label>
        <input type="time" class="blockTime">

        <label><b>Event</b></label>
        <select class="eventSelect">
            <option value="" disabled selected hidden>Select Event</option>
            <option>Birthday</option>
            <option>Anniversary</option>
            <option>Engagement</option>
            <option>Sangeet</option>
            <option>Ring Ceremony</option>
            <option>Roka Ceremony</option>
            <option>Wedding</option>
            <option>Destination Wedding</option>
            <option>Corporate</option>
            <option>Get Together</option>
            <option>Other</option>
        </select>

        <label><b>Offerings</b></label>
        <textarea class="blockOfferings" placeholder="Offerings (one per line)"></textarea>

        <label><b>Total Amount</b></label>
        <input type="number" class="blockAmount">

        <button class="remove" onclick="this.parentElement.remove()">Remove</button>
    `;
    blocks.appendChild(div);
}

/* GENERATE PDF */
function generatePDF() {
    pClient.innerText = client.value;

    const eventType =
        eventTypeSelect.value === "Other"
            ? eventTypeOther.value
            : eventTypeSelect.value;

    pEvent.innerText = eventType || "";

    if (dateFrom.value) {
        pDates.innerText = dateTo.value
            ? `${formatDate(dateFrom.value)} to ${formatDate(dateTo.value)}`
            : formatDate(dateFrom.value);
    }

    pdfBlocks.innerHTML = "";
    let total = 0;

    document.querySelectorAll(".block").forEach(block => {
        const date = block.querySelector(".blockDate").value;
        const venue = block.querySelector(".blockVenue").value;
        const time = block.querySelector(".blockTime").value;
        const event = block.querySelector(".eventSelect").value;
        const offerings = block.querySelector(".blockOfferings").value;
        const amount = Number(block.querySelector(".blockAmount").value || 0);

        total += amount;

        pdfBlocks.insertAdjacentHTML("beforeend", `
            <div class="section">
                <b>DATE:</b> ${date ? formatDate(date) : ""}<br>
                <b>VENUE:</b> ${venue}<br>
                <b>TIME:</b> ${time}<br>
                <b>EVENT:</b> ${event}<br><br>

                <b>OFFERINGS</b>
                <div class="items">
                    ${offerings.split("\n").map(i => "• " + i).join("<br>")}
                </div>

                <div class="total">Total: ₹ ${amount}</div>
            </div>
        `);
    });

    grandTotal.innerText = total;

    html2pdf().from(pdf).set({
        filename: "Event_Quotation.pdf",
        margin: 10,
        html2canvas: { scale: 2 },
        jsPDF: { format: "a4", orientation: "portrait" }
    }).save();
}

/* ADD FIRST BLOCK */
addBlock();
</script>

</body>
</html>
