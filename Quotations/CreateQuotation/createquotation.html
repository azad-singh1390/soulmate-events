<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Soulmate Event Quotation</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        .section-line {
            border-top: 4px solid #ccc;
            margin: 20px 0;
        }

        .event-box {
            border: 2px solid #d6d6d6;
            border-radius: 10px;
            padding: 15px 20px;
            margin: 15px 0;
            background: #fafafa;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        }

        .event-line {
            display: grid;
            grid-template-columns: 120px 15px auto;
            margin-bottom: 8px;
        }

        .label {
            font-weight: bold;
            color: #444;
        }

        .colon {
            text-align: center;
        }

        .value {
            color: #222;
        }



        .event-card {
            border: 1px solid #333;
            margin-top: 20px;
        }

        .event-header {
            background: #b7bfce;
            padding: 5px;
            font-family: Arial;
        }

        .event-header .row {
            display: flex;
            gap: 20px;
            font-size: 22px;
            margin: 4px 0;
        }

        .event-header .label {
            width: 90px;
            font-weight: bold;
            color: #2f4e85;
        }

        .event-header .value {
            color: #2f4e85;
        }

        .event-header .date {
            color: #c55200;
            font-weight: bold;
        }

        .offer-bar {
            background: #e97b2d;
            color: white;
            text-align: center;
            font-family: Arial, sans-serif;
            padding: 18px;
            font-weight: bold;
            letter-spacing: 1px;
            border-top: 1px solid black;
            border-bottom: 1px solid black;
        }

        .offer-list {
            padding: 20px;
            font-family: Arial, sans-serif;
        }

        .offer-list ul {
            margin: 0;
        }

        .offer-list li {
            margin: 14px 0;
        }

        .offer-line {
            border-top: 1px solid #333;
            padding: 15px 20px;
        }

        .total-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            border-top: 1px solid black;
        }

        .total-label {
            text-align: center;
            padding: 12px;
            font-weight: bold;
            color: #c55200;
        }

        .total-value {
            text-align: center;
            padding: 12px;
            border-left: 1px solid black;
            font-weight: bold;
            color: #c55200;
        }


        body {
            font-family: "Times New Roman", serif;
            background: #f2f2f2;
            padding: 20px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 6px;
            margin-bottom: 8px;
        }

        button {
            padding: 8px 14px;
            background: black;
            color: white;
            border: none;
            cursor: pointer;
            margin-top: 5px;
        }

        .block {
            background: white;
            padding: 15px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
        }

        .remove {
            background: darkred;
        }

        .date-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .date-row input {
            flex: 1;
        }

        .disabled-section {
            opacity: 0.5;
            pointer-events: none;
        }

        .section {
            page-break-inside: avoid;
            break-inside: avoid;
        }

        #pdf {
            position: relative;
            width: 700px;
            box-sizing: border-box;
            background: white;
            padding: 30px;
            display: none;
            /* hide properly */
        }

        .quotation-header {
            width: 635px;
            border: 2px solid #e57f3a;
            font-family: Arial, sans-serif;
        }

        .header-row,
        .quotation-row {
            display: grid;
            grid-template-columns: 220px auto;
            align-items: center;
            padding: 8px 16px;
            font-size: 18px;
            border-bottom: 1px solid #e57f3a;
        }

        /* Top row (orange) */
        .header-row {
            background-color: #e8a173;
        }

        /* Other rows (light peach) */
        .quotation-row {
            background-color: #f3dfd2;
        }

        .header-label {
            font-weight: bold;
            letter-spacing: 3px;
        }

        .header-value {
            text-align: left;
        }

        /* Remove last border */
        .quotation-header div:last-child {
            border-bottom: none;
        }

        .section {
            margin-top: 25px;
        }

        .items {
            margin-left: 20px;
        }

        .total {
            font-weight: bold;
            margin-top: 8px;
        }
    </style>
</head>

<body>

    <h2>Quotation Details</h2>

    <input id="client" placeholder="Client Name" value="Rahul Sharma">

    <label>
        <input type="checkbox" id="enableEventDetails" checked onchange="toggleEventDetails()">
        Enable Event Details
    </label>

    <br><br>

    <div id="eventDetails">

        <select id="eventTypeSelect" onchange="handleEventTypeChange()">
            <option selected>Wedding</option>
            <option>Birthday</option>
            <option>Anniversary</option>
            <option>Engagement</option>
            <option>Sangeet</option>
            <option>Ring Ceremony</option>
            <option>Roka Ceremony</option>
            <option>Destination Wedding</option>
            <option>Corporate</option>
            <option>Get Together</option>
            <option value="Other">Other</option>
        </select>

        <input id="eventTypeOther" placeholder="Enter Event Type" style="display:none;">

        <select id="eventVenueSelect" onchange="handleEventVenueChange()">
            <option selected>Noor Mahal</option>
            <option>Eden</option>
            <option>Gulmohar</option>
            <option>Amani Farms</option>
            <option>Emarld</option>
            <option value="Other">Other</option>
        </select>

        <input id="eventVenueOther" placeholder="Enter Event Venue" style="display:none;">

        <label><b>Event Dates</b></label>
        <div class="date-row">
            <span><b>From</b></span>
            <input type="date" id="dateFrom">
            <span><b>To</b></span>
            <input type="date" id="dateTo">
        </div>
    </div>

    <h3>Event Blocks</h3>
    <div id="blocks"></div>

    <button onclick="addBlock()">➕ Add New Event Block</button>
    <button onclick="generatePDF()">📄 Generate PDF</button>
    <button onclick="createTextFile()">Download TXT</button>
    <button onclick="viewTextFile()">View TXT</button>

    <hr>

    <div id="pdf">
        <h2 style="text-align:center; text-decoration:underline; color: #c55200;">Soulmate Events Quotation</h2>

        <div class="quotation-header">
            <div class="header-row">
                <div class="header-label">CLIENT NAME</div>
                <div class="header-value" id="pClient"></div>
            </div>

            <div class="quotation-row" id="rowEvent">
                <div class="header-label">EVENT</div>
                <div class="header-value" id="pEvent"></div>
            </div>

            <div class="quotation-row" id="rowDates">
                <div class="header-label">DATES</div>
                <div class="header-value" id="pDates"></div>
            </div>

            <div class="quotation-row" id="rowVenue">
                <div class="header-label">VENUE</div>
                <div class="header-value" id="pVenue"></div>
            </div>
        </div>

        <div id="pdfBlocks"></div>

        <hr>
        <!-- <div class="total">Grand Total: ₹ <span id="grandTotal"></span></div> -->
    </div>

    <script>

        let blockCount = 0;


        function renderSection(block, checkboxSelector, textareaSelector) {

            const checkbox = block.querySelector(checkboxSelector);
            const textarea = block.querySelector(textareaSelector);

            if (checkbox.checked && textarea.value.trim() !== "") {
                const items = textarea.value
                    .split("\n")
                    .filter(i => i.trim() !== "")
                    .map(i => `<li>${i}</li>`)
                    .join("");

                return `
        <ul>${items}</ul>
        <div class="section-line"></div>
        `;
            }

            return "";
        }

        function replaceSpacesWithUnderscore(str) {
            return str.replace(/\s+/g, "_");
        }

        function toggleEventDetails() {
            const enabled = enableEventDetails.checked;
            eventDetails.classList.toggle("disabled-section", !enabled);
        }

        function handleEventTypeChange() {
            eventTypeOther.style.display = eventTypeSelect.value === "Other" ? "block" : "none";
        }

        function handleEventVenueChange() {
            eventVenueOther.style.display = eventVenueSelect.value === "Other" ? "block" : "none";
        }

        function formatDate(dateStr) {
            return new Date(dateStr).toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
        }

        function getTodayDate() {
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        }

        function formatTime(timeStr) {
            return new Date("1970-01-01T" + timeStr)
                .toLocaleTimeString("en-IN", { hour: "numeric", minute: "2-digit" });
        }

        function generateSection(title, textarea, checkbox) {

            if (!checkbox.checked) return "";

            let content = textarea.value.trim();

            if (!content) return "";

            return `<b>${title}</b>
<div class="items">
${content.split("\n").map(i => "• " + i).join("<br>")}
</div>`;
        }

        function addBlock() {
            blockCount++;
            const div = document.createElement("div");
            div.className = "block";

            div.innerHTML = `
<h4>Event Block ${blockCount}</h4>

<label><b>Date</b></label>
<input type="date" class="blockDate">

<label><b>Venue</b></label>
<select class="blockVenue">
<option selected>Deewan-E-Aam, Noor Mahal</option>
<option>Deewan-E-Khas, Noor Mahal</option>
<option>Darbar Hall, Noor Mahal</option>
<option>Dera, Noor Mahal</option>
<option>Sheesh Mahal, Noor Mahal</option>
<option>Rang Mahal, Noor Mahal</option>
<option>Raja Bagh, Noor Mahal</option>
<option>Rani Bagh</option>
<option>Jal Mahal</option>
<option value="Other">Other</option>
</select>

<input class="blockVenueOther" placeholder="Enter Venue" style="display:none;">

<label><b>Time</b></label>
<input type="time" class="blockTime" value="19:00">

<label><b>Event</b></label>
<select class="blockEventSelect">
<option selected>Wedding</option>
<option>Birthday</option>
<option>Sangeet</option>
<option>Engagement</option>
<option value="Other">Other</option>
</select>

<input class="blockEventOther" placeholder="Enter Event Name" style="display:none;">

<label><b>Audio Setup</b></label>
<input type="checkbox" class="checkboxSoundSetup">
<textarea class="blockSoundSetup autoResize" >Sound System
Cordless Mics
Led Console
Professional DJ Jockey
Sound Engineer
Genset & Labour</textarea>

<label><b>Floor & Stage</b></label>
<input type="checkbox" class="checkboxFloorStage">
<textarea class="blockFloorStage autoResize" disabled>Stage Platform 16x32 With Staircase & carpeting
Led Or Flex Floor As Per Requirement</textarea>

<label><b>Lights & Truss</b></label>
<input type="checkbox" class="checkboxLightsTruss">
<textarea class="blockLightsTruss autoResize" disabled>2 Pole Truss Structure
Sharpy, Led & Blinder Lights
Professional Light Operator</textarea>

<label><b>Led Screen</b></label>
<input type="checkbox" class="checkboxLedScreen">
<textarea class="blockLedScreen autoResize" disabled>Double Led Screen [300 Sq. Ft.]
Professional video Operator</textarea>

<label><b>Anchor & Artists</b></label>
<input type="checkbox" class="checkboxAnchorArtists">
<textarea class="blockAnchorArtists autoResize" disabled>
Professional Anchor
Bride Groom Entry Artists</textarea>


<label><b>Techrider</b></label>
<input type="checkbox" class="checkboxTechrider">
<textarea class="blockTechrider autoResize" disabled>As Per Requirement</textarea>

<label><b>Other Requirements</b></label>
<input type="checkbox" class="checkboxOtherRequirements">
<textarea class="blockOtherRequirements autoResize" disabled>Green Room Setup
Artist Hospitality</textarea>

<label><b>Special Effects</b></label>
<input type="checkbox" class="checkboxSpecialEffects">
<textarea class="blockSpecialEffects autoResize" disabled>
Sparkle Machines
Bubble Machine
Co2 Jets
Co2 Gun
Cold Pyro
Cold Pyro Guns
Color Guns
Low Fog 
Helium Balloons
Fireworks
Stick Lights
Color Shots
Laser Light
Spot Light</textarea>


<label><b>Barat Setup</b></label>
<input type="checkbox" class="checkboxBaratSetup">
<textarea class="blockBaratSetup autoResize" disabled>
10 Led Chattar
DJ On Wheels
Vintage Car
Dholies (6)</textarea>

<label>
<input type="checkbox" class="checkboxAmount">
<b>Total Amount</b>
</label>

<input type="number" class="blockAmount" value="0" disabled>

<button class="remove" onclick="this.parentElement.remove()">Remove</button>
`;
            blocks.appendChild(div);

            enableCheckboxLogic(div);

            div.querySelector(".blockDate").value = getTodayDate();

            enableAutoResize(div);

            /* 🔥 ENABLE OTHER OPTION LOGIC */

            // Venue Other
            const venueSelect = div.querySelector(".blockVenue");
            const venueOther = div.querySelector(".blockVenueOther");

            venueSelect.onchange = () => {
                if (venueSelect.value === "Other") {
                    venueOther.style.display = "block";
                } else {
                    venueOther.style.display = "none";
                    venueOther.value = "";
                }
            };

            // Event Other
            const eventSelect = div.querySelector(".blockEventSelect");
            const eventOther = div.querySelector(".blockEventOther");

            eventSelect.onchange = () => {
                if (eventSelect.value === "Other") {
                    eventOther.style.display = "block";
                } else {
                    eventOther.style.display = "none";
                    eventOther.value = "";
                }
            };
        }


        function enableCheckboxLogic(container) {

            container.querySelectorAll("input[type='checkbox']").forEach(cb => {

                let target = cb.nextElementSibling;

                // If next element is not textarea/input, find the next input/textarea
                if (!target || (target.tagName !== "TEXTAREA" && target.tagName !== "INPUT")) {
                    target = cb.parentElement.nextElementSibling;
                }

                if (!target) return;

                if (target.tagName === "TEXTAREA" || target.tagName === "INPUT") {

                    target.disabled = true;

                    cb.addEventListener("change", function () {

                        target.disabled = !this.checked;

                        // Auto resize textarea when enabled
                        if (this.checked && target.tagName === "TEXTAREA") {
                            target.style.height = "auto";
                            target.style.height = target.scrollHeight + "px";
                        }

                    });

                }

            });

        }
        function viewTextFile() {

            let content = "";
            content += "Soulmate Event Planning\n";
            content += "----------------------------------\n\n";

            content += "CLIENT NAME : " + document.getElementById("client").value + "\n";

            if (enableEventDetails.checked) {

                let eventType = eventTypeSelect.value === "Other"
                    ? eventTypeOther.value
                    : eventTypeSelect.value;

                let mainVenue = eventVenueSelect.value === "Other"
                    ? eventVenueOther.value
                    : eventVenueSelect.value;

                content += "EVENT       : " + eventType + "\n";
                content += "DATES       : " + formatDate(dateFrom.value) + " to " + formatDate(dateTo.value) + "\n";
                content += "VENUE       : " + mainVenue + "\n";
            }

            content += "\n----------------------------------\n\n";

            let total = 0;

            document.querySelectorAll(".block").forEach((block, index) => {

                let amount = 0;

                const amountCheckbox = block.querySelector(".checkboxAmount");

                if (amountCheckbox.checked) {
                    amount = Number(block.querySelector(".blockAmount").value) || 0;
                    total += amount;
                }

                let blockVenueSelect = block.querySelector(".blockVenue");
                let blockVenue = blockVenueSelect.value === "Other"
                    ? block.querySelector(".blockVenueOther").value
                    : blockVenueSelect.value;

                let blockEventSelect = block.querySelector(".blockEventSelect");
                let blockEvent = blockEventSelect.value === "Other"
                    ? block.querySelector(".blockEventOther").value
                    : blockEventSelect.value;

                content += "DATE  : " + formatDate(block.querySelector(".blockDate").value) + "\n";
                content += "VENUE : " + blockVenue + "\n";
                content += "TIME  : " + formatTime(block.querySelector(".blockTime").value) + "\n";
                content += "EVENT : " + blockEvent + "\n\n";

                function addSection(title, textareaClass, checkboxClass) {

                    let checkbox = block.querySelector(checkboxClass);
                    if (!checkbox.checked) return;

                    let value = block.querySelector(textareaClass).value.trim();

                    if (value) {
                        content += title + "\n";
                        value.split("\n").forEach(line => {
                            content += " - " + line + "\n";
                        });
                        content += "\n";
                    }
                }

                addSection("Sound Setup", ".blockSoundSetup", ".checkboxSoundSetup");
                addSection("Floor & Stage", ".blockFloorStage", ".checkboxFloorStage");
                addSection("Lights & Truss", ".blockLightsTruss", ".checkboxLightsTruss");
                addSection("Led Screen", ".blockLedScreen", ".checkboxLedScreen");
                addSection("Anchor & Artists", ".blockAnchorArtists", ".checkboxAnchorArtists");
                addSection("Techrider", ".blockTechrider", ".checkboxTechrider");
                addSection("Other Requirements", ".blockOtherRequirements", ".checkboxOtherRequirements");
                addSection("Special Effects", ".blockSpecialEffects", ".checkboxSpecialEffects");
                addSection("Barat Setup", ".blockBaratSetup", ".checkboxBaratSetup");
                // content += "Total : ₹ " + amount.toLocaleString("en-IN") + "\n";
                // content += "\n----------------------------------\n\n";
            });

            content += "\n----------------------------------\n\n";
            // content += "GRAND TOTAL : ₹ " + total.toLocaleString("en-IN") + "\n";

            // 🔥 SHOW IN NEW WINDOW
            let newWindow = window.open();
            newWindow.document.write("<pre>" + content + "</pre>");
            newWindow.document.close();
        }

        function createTextFile() {

            let content = "";
            content += "Soulmate Event Details\n";
            content += "----------------------------------\n\n";

            // Client
            content += "CLIENT NAME : " + document.getElementById("client").value + "\n";

            // Event details only if enabled
            if (enableEventDetails.checked) {

                let eventType = eventTypeSelect.value === "Other"
                    ? eventTypeOther.value
                    : eventTypeSelect.value;

                let mainVenue = eventVenueSelect.value === "Other"
                    ? eventVenueOther.value
                    : eventVenueSelect.value;

                content += "EVENT       : " + eventType + "\n";
                content += "DATES       : " + formatDate(dateFrom.value) + " to " + formatDate(dateTo.value) + "\n";
                content += "VENUE       : " + mainVenue + "\n";
            }

            content += "\n----------------------------------\n\n";

            let total = 0;
            let hasAmount = false;
            let firstBlock = document.querySelector(".blockDate");
            let globaldate = firstBlock ? formatDate(firstBlock.value) : "";
            document.querySelectorAll(".block").forEach((block, index) => {

                let amount = 0;

                const amountCheckbox = block.querySelector(".checkboxAmount");

                if (amountCheckbox.checked) {
                    amount = Number(block.querySelector(".blockAmount").value) || 0;
                    total += amount;
                    hasAmount = true;
                }

                let blockVenueSelect = block.querySelector(".blockVenue");
                let blockVenue = blockVenueSelect.value === "Other"
                    ? block.querySelector(".blockVenueOther").value
                    : blockVenueSelect.value;

                let blockEventSelect = block.querySelector(".blockEventSelect");
                let blockEvent = blockEventSelect.value === "Other"
                    ? block.querySelector(".blockEventOther").value
                    : blockEventSelect.value;

                if (index === 0) {
                    globaldate = formatDate(block.querySelector(".blockDate").value);
                }
                content += "DATE  : " + formatDate(block.querySelector(".blockDate").value) + "\n";
                content += "VENUE : " + blockVenue + "\n";
                content += "TIME  : " + formatTime(block.querySelector(".blockTime").value) + "\n";
                content += "EVENT : " + blockEvent + "\n\n";


                function addSection(title, textareaClass, checkboxClass) {

                    let checkbox = block.querySelector(checkboxClass);
                    if (!checkbox.checked) return;

                    let value = block.querySelector(textareaClass).value.trim();

                    if (value) {
                        content += title + "\n";
                        value.split("\n").forEach(line => {
                            content += " - " + line + "\n";
                        });
                        content += "\n";
                    }
                }

                addSection("Sound Setup", ".blockSoundSetup", ".checkboxSoundSetup");
                addSection("Floor & Stage", ".blockFloorStage", ".checkboxFloorStage");
                addSection("Lights & Truss", ".blockLightsTruss", ".checkboxLightsTruss");
                addSection("Led Screen", ".blockLedScreen", ".checkboxLedScreen");
                addSection("Anchor & Artists", ".blockAnchorArtists", ".checkboxAnchorArtists");
                addSection("Techrider", ".blockTechrider", ".checkboxTechrider");
                addSection("Other Requirements", ".blockOtherRequirements", ".checkboxOtherRequirements");
                addSection("Special Effects", ".blockSpecialEffects", ".checkboxSpecialEffects");
                addSection("Barat Setup", ".blockBaratSetup", ".checkboxBaratSetup");


                if (amountCheckbox.checked) {
                    content += "Total : " + amount.toLocaleString("en-IN") + "\n";
                    content += "\n----------------------------------\n\n";
                }
                else {
                    content += "\n----------------------------------\n\n";
                }
            });

            if (hasAmount) {
                content += "GRAND TOTAL : ₹ " + total.toLocaleString("en-IN") + "\n";
            }

            // content += "GRAND TOTAL : ₹ " + total.toLocaleString("en-IN") + "\n";

            // Create file
            let blob = new Blob([content], { type: "text/plain" });
            let link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "SoulmateEvents_" + client.value + "_" + replaceSpacesWithUnderscore(globaldate) + "_Quotation.txt";
            link.click();
            link.download = "SoulmateEvents_" + client.value + "_" + replaceSpacesWithUnderscore(globaldate) + "_Plannning.txt";
            link.click();
        }
        function generatePDF() {


            const pdf = document.getElementById("pdf");

            pdf.style.display = "block";   // 👈 show temporarily

            // 🔴 VALIDATE BLOCK VENUE & EVENT "OTHER"
            const blocks = document.querySelectorAll(".block");

            for (let i = 0; i < blocks.length; i++) {

                const block = blocks[i];

                // Venue validation
                const venueSelect = block.querySelector(".blockVenue");
                const venueOther = block.querySelector(".blockVenueOther");

                if (venueSelect.value === "Other" && !venueOther.value.trim()) {
                    alert(`Please enter Venue in 'Other' field for Block ${i + 1}.`);
                    venueOther.focus();
                    return; // 🚫 STOP FUNCTION
                }

                // Event validation
                const eventSelect = block.querySelector(".blockEventSelect");
                const eventOther = block.querySelector(".blockEventOther");

                if (eventSelect.value === "Other" && !eventOther.value.trim()) {
                    alert(`Please enter Event in 'Other' field for Block ${i + 1}.`);
                    eventOther.focus();
                    return; // 🚫 STOP FUNCTION
                }
            }

            // EVENT TYPE (handle Other validation)
            if (eventTypeSelect.value === "Other") {

                if (!eventTypeOther.value.trim()) {
                    alert("Please enter Event Type in 'Other' field.");
                    eventTypeOther.focus(); // optional: auto focus
                    return; // 🚫 stop PDF generation
                }

            }


            // EVENT VENUE (handle Other validation)

            if (eventVenueSelect.value === "Other") {
                if (!eventVenueOther.value.trim()) {
                    alert("Please enter Event Venue in 'Other' field.");
                    eventVenueOther.focus(); // optional: auto focus
                    return; // 🚫 stop PDF generation
                }
            }

            const eventDetailsEnabled = enableEventDetails.checked;

            pClient.innerText = client.value;


            // get the row elements
            let rowEvent = document.getElementById("rowEvent");
            let rowDates = document.getElementById("rowDates");
            let rowVenue = document.getElementById("rowVenue");

            // clear text first (optional but safe)
            document.getElementById("pEvent").innerText = "";
            document.getElementById("pDates").innerText = "";
            document.getElementById("pVenue").innerText = "";

            // toggle based on checkbox
            if (enableEventDetails.checked) {

                rowEvent.style.display = "grid";
                rowDates.style.display = "grid";
                rowVenue.style.display = "grid";

                // fill values
                let eventType = eventTypeSelect.value === "Other"
                    ? eventTypeOther.value.trim()
                    : eventTypeSelect.value;

                let mainVenue = eventVenueSelect.value === "Other"
                    ? eventVenueOther.value.trim()
                    : eventVenueSelect.value;

                if (eventType) rowEvent.querySelector("#pEvent").innerText = eventType;
                if (dateFrom.value && dateTo.value) rowDates.querySelector("#pDates").innerText = formatDate(dateFrom.value) + " to " + formatDate(dateTo.value);
                if (mainVenue) rowVenue.querySelector("#pVenue").innerText = mainVenue;

            } else {
                // hide the rows if unchecked
                rowEvent.style.display = "none";
                rowDates.style.display = "none";
                rowVenue.style.display = "none";
            }

            pdfBlocks.innerHTML = "";
            let total = 0;

            let globaldate = "";
            let globacount = 0;
            document.querySelectorAll(".block").forEach(block => {

                let amount = 0;

                const amountCheckbox = block.querySelector(".checkboxAmount");

                if (amountCheckbox.checked) {
                    amount = Number(block.querySelector(".blockAmount").value) || 0;
                    total += amount;
                }

                if (globacount === 0) {
                    globaldate = formatDate(block.querySelector(".blockDate").value);
                }
                globacount++;

                // BLOCK VENUE (handle Other)
                let blockVenueSelect = block.querySelector(".blockVenue");
                let blockVenue = blockVenueSelect.value === "Other"
                    ? (block.querySelector(".blockVenueOther").value || "Custom Venue")
                    : blockVenueSelect.value;

                // BLOCK EVENT (handle Other)
                let blockEventSelect = block.querySelector(".blockEventSelect");
                let blockEvent = blockEventSelect.value === "Other"
                    ? (block.querySelector(".blockEventOther").value || "Custom Event")
                    : blockEventSelect.value;

                pdfBlocks.innerHTML += `

<div class="event-card">

<div class="event-header">

<div class="row">
<span class="label">DATE</span>
<span class="date">${formatDate(block.querySelector(".blockDate").value)}</span>
</div>

<div class="row">
<span class="label">VENUE</span>
<span class="value">${blockVenue}</span>
</div>

<div class="row">
<span class="label">TIME</span>
<span class="value">${formatTime(block.querySelector(".blockTime").value)}</span>
</div>

<div class="row">
<span class="label">EVENT</span>
<span class="value">${blockEvent}</span>
</div>

</div>

<div class="offer-bar">OFFERINGS</div>

<div class="offer-list">

${renderSection(block, ".checkboxSoundSetup", ".blockSoundSetup")}
${renderSection(block, ".checkboxFloorStage", ".blockFloorStage")}
${renderSection(block, ".checkboxLightsTruss", ".blockLightsTruss")}
${renderSection(block, ".checkboxLedScreen", ".blockLedScreen")}
${renderSection(block, ".checkboxAnchorArtists", ".blockAnchorArtists")}
${renderSection(block, ".checkboxTechrider", ".blockTechrider")}
${renderSection(block, ".checkboxOtherRequirements", ".blockOtherRequirements")}
${renderSection(block, ".checkboxSpecialEffects", ".blockSpecialEffects")}
${renderSection(block, ".checkboxBaratSetup", ".blockBaratSetup")}

</div>
${amount ? `
<div class="total-row">
<div class="total-label">TOTAL (A)</div>
<div class="total-value">₹ ${amount.toLocaleString("en-IN")} /-</div>
</div>
` : ""}

</div>
`;
            });

            // grandTotal.innerText = total.toLocaleString("en-IN");

            if (!pdf.innerHTML.trim()) {
                alert("No content available to generate PDF.");
                return;
            }
            console.log("PDF Content:", pdf.innerHTML);
            // grandTotal.innerText = total.toLocaleString("en-IN");

            // Grand Total (only if at least one block has amount)
            if (document.querySelector(".checkboxAmount:checked")) {
                pdfBlocks.innerHTML += `<div class="total">GRAND TOTAL: ₹ ${total.toLocaleString("en-IN")}</div>`;
            }


            html2pdf()
                .set({
                    margin: 15,
                    filename: "SoulmateEvents_" + client.value + "_" + replaceSpacesWithUnderscore(globaldate) + "_Quotation.pdf",
                    image: { type: "jpeg", quality: 0.98 },
                    html2canvas: {
                        scale: 1,
                        scrollY: 0,
                        useCORS: true
                    },
                    jsPDF: {
                        unit: "mm",
                        format: "a4",
                        orientation: "portrait"
                    },
                    pagebreak: { mode: ['css'] }
                })
                .from(pdf)
                .outputPdf('blob')
                .then(function (blob) {

                    const url = URL.createObjectURL(blob);

                    const a = document.createElement("a");
                    a.href = url;
                    a.download = "SoulmateEvents_" + client.value + "_" + replaceSpacesWithUnderscore(globaldate) + "_Quotation.pdf";

                    document.body.appendChild(a);
                    a.click();

                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                });
        }
        addBlock();
        enableAutoResize(document);

        dateFrom.value = getTodayDate();
        dateTo.value = getTodayDate();


        function autoResizeTextarea(textarea) {
            textarea.style.height = "auto";
            textarea.style.height = textarea.scrollHeight + "px";
        }

        function enableAutoResize(container) {

            container.querySelectorAll(".autoResize").forEach(textarea => {

                autoResizeTextarea(textarea);

                textarea.addEventListener("input", function () {
                    autoResizeTextarea(this);
                });

            });

        }

    </script>

</body>

</html>
